name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: compact-handoff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install package metadata
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run deterministic test suite
        run: npm test

      - name: Run post-run release check
        run: npm run postrun:check

      - name: Verify package contents
        run: npm pack --dry-run
